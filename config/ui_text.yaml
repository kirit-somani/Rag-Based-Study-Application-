app:
  page_title: "StudyRAG — Smart AI Study Partner"
  page_icon: "⚡"
  brand_name: "StudyRAG"
  brand_subtitle: "RAG-Powered AI Study Assistant"
  version_tag: "StudyRAG v1.0.0 • Powered by LangChain & Vector Search"

theme:
  toggle_label: "Dark Mode"
  dark: "Dark"
  light: "Light"

welcome:
  hero_badge: "⚡ Intelligent RAG Study Partner"
  hero_title: "Accelerate Your Learning with StudyRAG"
  hero_subtitle: "Transform textbooks, lecture slides, and notes into an interactive personal tutor. Ask factual questions, auto-generate quizzes, memorise with flashcards, and condense revision sheets."
  get_started_btn: "Get Started — Upload Notes"
  quick_chat_btn: "💬 Jump into Chat"
  stats_badge_1: "Zero Hallucinations • Exact Citations"
  stats_badge_2: "Powered by Groq High-Speed LLMs"
  features_title: "Explore Core Learning Modules"
  features:
    - key: "chat"
      icon: "💬"
      title: "Contextual Q&A"
      desc: "Ask any question about your curriculum and receive factual answers with exact citations and page references."
      btn_label: "Open Q&A Chat →"
    - key: "quiz"
      icon: "📝"
      title: "Adaptive Practice Quizzes"
      desc: "Generate custom multiple-choice tests with automatic grading and performance diagnostics tailored to your syllabus."
      btn_label: "Open Quizzes →"
    - key: "flashcards"
      icon: "🗂"
      title: "Active-Recall Flashcards"
      desc: "Turn dense definitions, algorithms, and formulas into spaced-repetition prompt decks for exam prep."
      btn_label: "Open Flashcards →"
    - key: "summaries"
      icon: "📑"
      title: "High-Yield Summaries"
      desc: "Condense 100+ page textbook chapters into structured executive summaries and quick revision guides."
      btn_label: "Open Summaries →"
  steps_title: "How It Works in 3 Simple Steps"
  steps:
    - step: "01"
      title: "Upload Materials"
      desc: "Drop your PDF textbooks, syllabi, or slides into the Study Library to generate vector embeddings."
    - step: "02"
      title: "Select Your Focus"
      desc: "Filter your queries across your entire syllabus or narrow in on a single specific document."
    - step: "03"
      title: "Master Your Subject"
      desc: "Engage in grounded study sessions, test yourself with auto-generated quizzes, and review your history."

